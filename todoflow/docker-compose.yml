version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: todoflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./todoflow-backend
    restart: unless-stopped
    env_file: ./todoflow-backend/.env
    ports:
      - "5000:5000"
    depends_on:
      - postgres

  frontend:
    build: ./todoflow-frontend
    restart: unless-stopped
    env_file: ./todoflow-frontend/.env.local
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data: